services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-change_me_locally}
      - POSTGRES_DB=sss_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-change_me_locally}
      - DB_NAME=sss_db
      - JWT_SECRET=${JWT_SECRET:-dev_only_secret_change_me}
      # Адрес(а) фронтенда через запятую. Пусто = разрешить любой.
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:5173}
    depends_on:
      - db

  frontend:
    build: ./client
    ports:
      - "5173:5173"
    stdin_open: true
    environment:
      - CHOKIDAR_USEPOLLING=true
      # Локально фронтенд ходит в локальный бэкенд, а не в Render.
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  db_data:
